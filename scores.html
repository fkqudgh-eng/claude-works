<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>찬양 콘티 · 2026 효성교회 청년부 하계 수련회</title>
<meta name="theme-color" content="#182c22">
<meta property="og:title" content="찬양 콘티 · 2026 효성교회 청년부 하계 수련회">
<meta property="og:description" content="목·금·토 예배 찬양 순서">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>%F0%9F%8E%B5</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
  :root{--deep:#182c22;--deep2:#12211a;--gold:#c8a05a;--gold2:#d9b978;--line:rgba(200,160,90,.28);}
  html,body{background:var(--deep2);
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;color:#fff;}
  .serif{font-family:'Nanum Myeongjo','Noto Serif KR',serif;}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--deep);
    padding:calc(20px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .back{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;
    width:38px;height:38px;background:rgba(255,255,255,.08);border-radius:50%;}
  .back svg{width:18px;height:18px;}
  .back:active{transform:scale(.94);}

  .head{margin-bottom:24px;}
  .head h1{font-size:32px;font-weight:800;margin-top:4px;line-height:1.2;}
  .head h1 span{color:var(--gold2);}

  .day{margin-bottom:26px;}
  .day > .dh{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;
    border-bottom:1px solid var(--line);margin-bottom:14px;}
  .dh b{font-size:22px;font-weight:800;color:var(--gold2);}
  .dh span{font-size:13px;opacity:.7;font-weight:600;}

  .sess{margin-bottom:16px;}
  .sess:last-child{margin-bottom:0;}
  .st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;
    color:#fff;background:rgba(255,255,255,.09);padding:5px 12px;border-radius:16px;margin-bottom:10px;}
  .st .dot{width:6px;height:6px;border-radius:50%;background:var(--gold2);}

  .song{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:13px;}
  .song .no{font-size:12px;font-weight:800;color:var(--gold2);min-width:16px;}
  .song .nm{flex:1;font-size:15.5px;font-weight:700;line-height:1.3;}
  .song .tag{font-size:10.5px;font-weight:800;color:#20140a;background:var(--gold2);
    padding:3px 8px;border-radius:10px;white-space:nowrap;}
  .song.note{background:transparent;border:1px dashed rgba(255,255,255,.18);}
  .song.note .nm{font-weight:600;opacity:.72;font-size:13.5px;}
  a.song{text-decoration:none;color:inherit;transition:background .15s;}
  a.song:active{transform:scale(.99);background:rgba(255,255,255,.1);}
  .song .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;
    font-size:11px;font-weight:800;color:var(--gold2);white-space:nowrap;opacity:.92;}
  .song .go svg{width:12px;height:12px;}
  .linknote{font-size:12px;opacity:.6;margin:2px 2px 12px;line-height:1.5;}

  .foot{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);
    font-size:12px;opacity:.55;line-height:1.6;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html" aria-label="초대장으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="head">
    <h1 class="serif">예배 <span>찬양 순서</span></h1>
  </div>

    <div class="day">
    <div class="dh"><b>목요일</b><span>7.23 (목)</span></div>
    <div class="sess">
      <div class="st"><span class="dot"></span>개회</div>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%A3%BC%EC%9D%98%20%EA%B8%B8%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">1</span><span class="nm">주의 길</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%A3%BC%EA%B0%80%20%EC%9D%BC%ED%95%98%EC%8B%9C%EB%84%A4%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">2</span><span class="nm">주가 일하시네</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <div class="linknote">↳ 가능하면 「주의 길 → 주가 일하시네」 두 곡을 이어서 진행</div>
      <div class="song note"><span class="no">·</span><span class="nm">짧게 기도 시간</span></div>
    </div>
    <div class="sess">
      <div class="st"><span class="dot"></span>저녁</div>
      <a class="song" href="https://www.youtube.com/results?search_query=%ED%95%98%EB%82%98%EB%8B%98%EC%9D%98%20%EC%97%B4%EC%8B%AC%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">1</span><span class="nm">하나님의 열심</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%95%84%EB%AC%B4%EA%B2%83%EB%8F%84%20%EB%91%90%EB%A0%A4%EC%9B%8C%20%EB%A7%90%EB%9D%BC%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">2</span><span class="nm">아무것도 두려워 말라</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%A3%BC%EA%B0%80%20%EC%9D%BC%ED%95%98%EC%8B%9C%EB%84%A4%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">3</span><span class="nm">주가 일하시네</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
    </div>
  </div>

  <div class="day">
    <div class="dh"><b>금요일</b><span>7.24 (금)</span></div>
    <div class="sess">
      <div class="st"><span class="dot"></span>아침</div>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%A3%BC%EC%9D%98%20%EA%B8%B8%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">1</span><span class="nm">주의 길</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%EB%B0%94%EB%8B%A4%EC%97%90%20%EA%B8%B8%EC%9D%84%20%ED%95%98%EB%8A%98%EC%97%90%20%EB%B9%9B%EC%9D%84%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">2</span><span class="nm">바다에 길을 하늘에 빛을</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
    </div>
    <div class="sess">
      <div class="st"><span class="dot"></span>저녁</div>
      <a class="song" href="https://www.youtube.com/results?search_query=%EB%B0%94%EB%8B%A4%EC%97%90%20%EA%B8%B8%EC%9D%84%20%ED%95%98%EB%8A%98%EC%97%90%20%EB%B9%9B%EC%9D%84%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">1</span><span class="nm">바다에 길을 하늘에 빛을</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%ED%95%98%EB%82%98%EB%8B%98%EC%9D%98%20%EC%97%B4%EC%8B%AC%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">2</span><span class="nm">하나님의 열심</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%95%84%EB%AC%B4%EA%B2%83%EB%8F%84%20%EB%91%90%EB%A0%A4%EC%9B%8C%20%EB%A7%90%EB%9D%BC%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">3</span><span class="nm">아무것도 두려워 말라</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%98%88%EC%88%98%20%EB%82%98%EC%9D%98%20%EC%A2%8B%EC%9D%80%20%EC%B9%98%EB%A3%8C%EC%9E%90%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">4</span><span class="nm">예수 나의 좋은 치료자</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
    </div>
  </div>

  <div class="day">
    <div class="dh"><b>토요일</b><span>7.25 (토)</span></div>
    <div class="sess">
      <div class="st"><span class="dot"></span>폐회</div>
      <a class="song" href="https://www.youtube.com/results?search_query=%EC%95%84%EB%AC%B4%EA%B2%83%EB%8F%84%20%EB%91%90%EB%A0%A4%EC%9B%8C%20%EB%A7%90%EB%9D%BC%20%EC%95%85%EB%B3%B4" target="_blank" rel="noopener"><span class="no">1</span><span class="nm">아무것도 두려워 말라</span><span class="go">악보<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></a>
    </div>
  </div>
  <div class="foot">🎵 곡을 누르면 악보·영상을 볼 수 있어요.</div>
</div>
</body>
</html>

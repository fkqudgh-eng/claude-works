name: Deploy invite to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-pages-kakao-share-7s03hz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the invite page + its OG image (keep the repo's other files out)
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp scores.html _site/scores.html
          cp og-image.jpg _site/og-image.jpg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
